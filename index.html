<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>뉴턴의 대포 — 궤도 시뮬레이터</title>

<!-- 폰트는 CSS @import 대신 link 로: @import 는 렌더 블로킹 체인을 늘립니다 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap">

<!-- 빈 favicon: 없으면 브라우저가 /favicon.ico 를 요청해 404 를 남깁니다 -->
<link rel="icon" href="data:,">

<link rel="stylesheet" href="./styles/index.css">
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="ui">

    <!-- 타이틀 -->
    <div class="title-bar">
      <h1>Newton's Cannon</h1>
      <p>궤도 역학 시뮬레이터</p>
    </div>

    <!-- HUD (우상단) -->
    <div class="hud" id="hud-panel">
      <div class="hud-title">Telemetry</div>
      <div class="hud-row">
        <span class="hud-label">속력</span>
        <span class="hud-value" id="hud-spd">— m/s</span>
      </div>
      <div class="hud-row">
        <span class="hud-label">고도</span>
        <span class="hud-value" id="hud-alt">—</span>
      </div>
      <div class="hud-row">
        <span class="hud-label">경과</span>
        <span class="hud-value" id="hud-t">0.0 s</span>
      </div>
      <div class="hud-row" style="margin-top:10px;padding-top:8px;border-top:1px solid var(--border)">
        <span class="hud-label">궤도</span>
        <span class="orbit-badge idle" id="hud-orbit">대기 중</span>
      </div>
      <div id="hud-stats" style="display:none">
        <hr class="stat-divider">
        <div class="hud-row">
          <span class="hud-label">최고고도</span>
          <span class="hud-value" id="hud-maxalt">—</span>
        </div>
        <div class="hud-row" id="hud-impact-row" style="display:none">
          <span class="hud-label">착탄각</span>
          <span class="hud-value" id="hud-impang">—</span>
        </div>
        <div class="hud-row" id="hud-dist-row" style="display:none">
          <span class="hud-label">비행거리</span>
          <span class="hud-value" id="hud-dist">—</span>
        </div>
      </div>
    </div>

    <!-- 좌상단 배지 -->
    <div class="info-badge">
      <div class="badge-pill">
        <span>줌</span><b id="zoom-val">1.00×</b>
      </div>
      <div class="badge-pill" id="simspd-badge" style="display:none">
        <span>시뮬</span><b id="simspd-val">×8</b>
      </div>
      <!-- 지표면 모드로 전환됐을 때만 표시 -->
      <div class="badge-pill badge-mode" id="mode-badge" style="display:none">
        <span>시점</span><b id="mode-val">지표면</b>
      </div>
      <!-- 압축 보기(로그 축척)일 때만 표시 — 궤도 모양이 왜곡된다는 경고 -->
      <div class="badge-pill badge-warn" id="scale-badge" style="display:none">
        <span>축척</span><b>압축 · 모양 왜곡</b>
      </div>
    </div>

    <!-- 컨트롤 패널 (우하단) -->
    <div class="ctrl-panel">
      <div class="ctrl-title">Launch Config</div>

      <!-- 발사각 슬라이더 -->
      <div class="ctrl-row">
        <div class="ctrl-label-row">
          <span class="ctrl-label">발사각</span>
          <span class="ctrl-val" id="v-ang">0°</span>
        </div>
        <input type="range" id="s-ang" min="-10" max="90" value="0" step="0.5">
      </div>

      <!-- 초기속도 슬라이더 -->
      <div class="ctrl-row" style="margin-bottom:4px">
        <div class="ctrl-label-row">
          <span class="ctrl-label">초기속도</span>
          <span class="ctrl-val" id="v-spd">4.0 km/s</span>
        </div>
        <input type="range" id="s-spd" min="0" max="12000" value="4000" step="50">
        <div class="speed-marker-wrap">
          <div id="marker-v1" class="speed-tick" style="color:rgba(58,142,255,0.75)">▲<br>원궤도</div>
          <div id="marker-v2" class="speed-tick" style="color:rgba(126,240,200,0.75)">▲<br>탈출</div>
        </div>
      </div>

      <!-- 시뮬레이션 속도 -->
      <div class="ctrl-row" style="margin-bottom:0">
        <div class="sim-speed-row">
          <span class="sim-speed-label">시뮬속도</span>
          <button class="speed-btn" data-mult="1">×1</button>
          <button class="speed-btn active" data-mult="8">×8</button>
          <button class="speed-btn" data-mult="32">×32</button>
          <button class="speed-btn" data-mult="128">×128</button>
        </div>
      </div>
    </div>

    <!-- 발사/리셋 버튼 (좌하단) -->
    <div class="btn-group">
      <button class="btn btn-fire" id="btn-fire">🚀 발사</button>
      <button class="btn btn-reset" id="btn-reset">↺ 리셋</button>
    </div>

    <!-- 체크박스 + 단축키 힌트 -->
    <div class="check-group">
      <label class="check-item">
        <input type="checkbox" id="chk-trail" checked>
        <span class="check-box"></span>궤적 표시
      </label>
      <label class="check-item">
        <input type="checkbox" id="chk-grid">
        <span class="check-box"></span>격자 표시
      </label>
      <label class="check-item" title="끄면 먼 우주를 로그 축척으로 압축해 80 Re 탈출까지 한 화면에 담습니다 (모양은 왜곡됨)">
        <input type="checkbox" id="chk-scale" checked>
        <span class="check-box"></span>실제 축척
      </label>
      <label class="check-item" title="끄면 지구를 가운데 두고 궤도 전체가 보이게 물러납니다 (실제 축척에서만)">
        <input type="checkbox" id="chk-follow" checked>
        <span class="check-box"></span>포탄 추적
      </label>
    </div>

    <div class="shortcut-hint">
      <span>Space: 발사 / R: 리셋 / G: 격자 / L: 축척 / F: 추적 / 1·2·3·4: 시뮬속도</span>
    </div>

  </div><!-- /.ui -->
</div>

<!-- 로직은 전부 src/ 아래 ES 모듈로 분리돼 있습니다. 진입점은 src/main.js 하나. -->
<script type="module" src="./src/main.js"></script>
</body>
</html>
